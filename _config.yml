title: Dave Wu
email: eyaswoo@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Dave Wu writes Golang, Ruby and Javascript (ES6).
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://straightdave.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: straightdave

# Build settings
theme: minima
markdown: kramdown
highlighter: rouge
show_excerpts: true

header_pages:
  - about.markdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - .github/
  - .ruby-version
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
